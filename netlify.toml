[functions]
  directory = "netlify/functions"

# Monthly AI Review — runs automatically at 06:00 UTC on the 1st of every
# month, independent of any farmer logging in. See monthly-review-cron-background.js.
# The "-background" suffix makes this a Netlify Background Function (up to
# 15 min execution) instead of the ~10-30s limit on regular functions — needed
# because it loops over every farmer, generating an AI review for each.
[functions."monthly-review-cron-background"]
  schedule = "0 6 1 * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; frame-src *; frame-ancestors *; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; connect-src *; font-src * data:;"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
